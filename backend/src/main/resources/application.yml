spring:
  application:
    name: modular-monolith-lab
  datasource:
    url: ${SUPABASE_DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}}
    username: ${SUPABASE_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${SUPABASE_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 60000
      idle-timeout: 30000
      keepalive-time: 15000
      connection-timeout: 30000
      minimum-idle: 3
      maximum-pool-size: 10
      connection-test-query: SELECT 1
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Tables are created via sql/schema.sql against Supabase, not by Hibernate.
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

app:
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
  inventory:
    low-stock-threshold: ${APP_INVENTORY_LOW_STOCK_THRESHOLD:5}

legacy-supply:
  base-url: ${LS_BASE_URL:https://legacysupply.onrender.com/api/v1}
  client-id: ${LS_CLIENT_ID:22-1382-413}
  api-key: ${LS_API_KEY:}

tiangge:
  base-url: ${TIANGGE_BASE_URL:https://legacysupply.onrender.com/tiangge/v1}
  client-id: ${TIANGGE_CLIENT_ID:${LS_CLIENT_ID:22-1382-413}}
  api-key: ${TIANGGE_API_KEY:${LS_API_KEY:}}
  heartbeat-ms: ${TIANGGE_HEARTBEAT_MS:30000}
  feed-poll-ms: ${TIANGGE_FEED_POLL_MS:3000}

server:
  port: ${PORT:8080}
